
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=Barlow:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
.wrap{font-family:'Barlow',sans-serif;background:var(--color-background-tertiary);padding:1.25rem;min-height:600px}
.header{margin-bottom:.875rem}
.header h2{font-family:'Source Serif 4',serif;font-size:20px;font-weight:600;color:var(--color-text-primary);margin-bottom:3px}
.header p{font-size:13px;color:var(--color-text-secondary)}
.score-bar{display:flex;align-items:center;gap:10px;margin-bottom:.875rem;font-size:13px;color:var(--color-text-secondary)}
.score-val{font-weight:600;font-size:14px;color:var(--color-text-primary)}
.progress-track{flex:1;height:5px;background:var(--color-border-tertiary);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:#1A9068;border-radius:3px;transition:width .4s ease}
.scene-wrap{position:relative;width:100%;border-radius:var(--border-radius-lg);overflow:hidden;border:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary);margin-bottom:.875rem;user-select:none}
.scene-img{display:block;width:100%;height:auto;pointer-events:none}
.node{position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;border:2.5px solid #1A5C9E;transform:translate(-50%,-50%);cursor:default;display:flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s,transform .15s;z-index:10;box-shadow:0 0 0 3px rgba(26,92,158,.15)}
.node.drag-over{border-color:#B56A10;background:#FDF3E0;transform:translate(-50%,-50%) scale(1.3)}
.node.correct{border-color:#1A9068;background:#E6F8F2;box-shadow:0 0 0 3px rgba(26,144,104,.15)}
.node.incorrect{border-color:#C0392B;background:#FCECEA;box-shadow:0 0 0 3px rgba(192,57,43,.15)}
.node-label{font-size:8px;font-weight:600;color:#1A5C9E;white-space:nowrap;pointer-events:none;letter-spacing:.02em;text-align:center;max-width:52px;line-height:1.1;padding:1px}
.node.correct .node-label{color:#0A4A35}
.node.incorrect .node-label{color:#7B1C12}
.feedback-bar{min-height:38px;padding:9px 13px;border-radius:var(--border-radius-md);font-size:13px;line-height:1.5;margin-bottom:.875rem;background:var(--color-background-secondary);color:var(--color-text-secondary);border:0.5px solid var(--color-border-tertiary);transition:background .2s,color .2s}
.feedback-bar.correct{background:#E6F8F2;color:#0A4A35;border-color:#1A9068}
.feedback-bar.incorrect{background:#FCECEA;color:#7B1C12;border-color:#C0392B}
.label-bank{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:.75rem 1rem}
.bank-title{font-size:11px;font-weight:600;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem}
.bank-grid{display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:5px 11px;border-radius:20px;background:#EAF4FC;border:1px solid #1A5C9E;color:#0F3F72;font-size:12px;font-weight:500;cursor:grab;transition:background .15s,opacity .2s;white-space:nowrap;user-select:none}
.chip:hover{background:#d0e8f7}
.chip.dragging{opacity:.35;cursor:grabbing}
.chip.used{opacity:.22;cursor:default;pointer-events:none}
.reset-btn{margin-top:.625rem;padding:6px 14px;font-size:12px;font-family:'Barlow',sans-serif;font-weight:500;background:transparent;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);color:var(--color-text-secondary);cursor:pointer;transition:background .15s}
.reset-btn:hover{background:var(--color-background-secondary)}
.banner{display:none;padding:10px 14px;background:#E6F8F2;border:0.5px solid #1A9068;border-radius:var(--border-radius-md);font-size:13px;color:#0A4A35;font-weight:500;margin-bottom:.875rem;text-align:center}
</style>

<div class="wrap">
  <h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden">Landform drag-and-drop assessment. Drag labels onto matching nodes on the landscape.</h2>
  <div class="header">
    <h2>Landform identification</h2>
    <p>Drag each label from the bank onto the matching white node on the landscape.</p>
  </div>
  <div class="score-bar">
    <span>Placed: <span class="score-val" id="sp">0</span> / <span id="st">18</span></span>
    <div class="progress-track"><div class="progress-fill" id="pf" style="width:0%"></div></div>
    <span>Correct: <span class="score-val" id="sc">0</span></span>
  </div>
  <div class="banner" id="banner"></div>
  <div class="scene-wrap" id="scene-wrap">
    <img class="scene-img" id="scene-img" alt="3D landscape with white nodes at landform locations" draggable="false" />
  </div>
  <div class="feedback-bar" id="fb">Drop a label onto a white node to begin.</div>
  <div class="label-bank">
    <div class="bank-title">Label bank</div>
    <div class="bank-grid" id="bank"></div>
    <button class="reset-btn" id="resetBtn">Reset all</button>
  </div>
</div>

  {id:'n2', x:11, y:22, ans:'Mesa',           fb:{c:'Mesa — a flat-topped elevated landform with steep sides. The word is Spanish for "table."', w:'The flat-topped brown formation with vertical sides on the left — that\'s a mesa.'}},
  {id:'n3', x:38, y:18, ans:'Hill',            fb:{c:'Hill — a raised landform, but not as steep or high as a mountain. No permanent snow.', w:'The rounded green elevation in the upper center — lower and softer than the mountain — is a hill.'}},
  {id:'n4', x:63, y:18, ans:'Glacier',         fb:{c:'Glacier — a slow-moving mass of compacted ice. Forms where snowfall exceeds snowmelt over many years.', w:'The blue-white ice on the mountain\'s face — that\'s a glacier, not just snow.'}},
  {id:'n5', x:17, y:30, ans:'Canyon',          fb:{c:'Canyon — a deep narrow valley carved by erosion over millions of years. The layered steep walls are the key visual.', w:'The deep cut between the mesa formations — that\'s a canyon, carved by water through rock.'}},
  {id:'n6', x:41, y:31, ans:'Waterfall',       fb:{c:'Waterfall — water dropping steeply over a rock edge. Often marks where resistant rock meets softer rock below.', w:'Follow the blue water where it drops sharply — that\'s a waterfall, not just a fast river.'}},
  {id:'n7', x:30, y:40, ans:'River',           fb:{c:'River — a natural flowing freshwater channel. These curves (meanders) mean the land is relatively flat here.', w:'The winding blue channel in the valley — that\'s the river. Its curves tell you the terrain is gentle.'}},
  {id:'n8', x:82, y:28, ans:'Valley',          fb:{c:'Valley — low land between hills or mountains, likely carved by glacier or river over thousands of years.', w:'The low zone between the mountain and the hills on the right — that\'s a valley.'}},
  {id:'n9', x:57, y:40, ans:'Flood Plain',     fb:{c:'Flood Plain — flat land alongside a river that floods periodically. Sediment deposits make these areas fertile.', w:'The wide flat area flanking the river as it broadens — that\'s a flood plain.'}},
  {id:'n10', x:68, y:43, ans:'Plain',          fb:{c:'Plain — mostly flat low-lying land. Plains form through erosion or sediment deposition and are often used for agriculture.', w:'The broad flat area between the river and the right hills — that\'s a plain, lower and larger than a plateau.'}},
  {id:'n11', x:50, y:50, ans:'River Mouth',    fb:{c:'River mouth — where a river empties into a larger body of water. The flow slows and sediment drops here.', w:'Where the river meets the open water at the bottom — that\'s the river mouth.'}},
  {id:'n12', x:82, y:52, ans:'Plateau',        fb:{c:'Plateau — high flat land. Unlike a plain, a plateau sits elevated above surrounding terrain with at least one steep edge.', w:'The high flat-topped brown formation on the right — that\'s a plateau, distinct from the lower plain.'}},

const TERMS = ['Mountain Peak','Mesa','Hill','Glacier','Canyon','Waterfall','River','Valley','Flood Plain','Plain','River Mouth','Delta','Plateau','Cliff','Beach','Sea Stack','Island','Ocean'];

const state = {};
NODES.forEach(n => state[n.id] = {placed:null, correct:false});
let dragTerm=null, placed=0, correct=0;

function pct(){return Math.round(correct/NODES.length*100)}

function updateScore(){
  document.getElementById('sp').textContent=placed;
  document.getElementById('sc').textContent=correct;
  document.getElementById('pf').style.width=(placed/NODES.length*100)+'%';
  if(placed===NODES.length){
    const b=document.getElementById('banner');
    b.style.display='block';
    const p=pct();
    if(p===100) b.textContent='You demonstrated mastery of all 18 landforms.';
    else if(p>=70) b.textContent=correct+' of 18 correct ('+p+'%). Review the highlighted nodes to build toward full mastery.';
    else b.textContent=correct+' of 18 correct ('+p+'%). Reset and try again — use the feedback on each node as your guide.';
  }
}

function showFeedback(correct, text, placed, answer){
  const fb=document.getElementById('fb');
  fb.className='feedback-bar '+(correct?'correct':'incorrect');
  fb.textContent=correct?placed+' — '+text:'That node shows '+answer+'. '+text;
}

function renderNodes(){
  const img=document.getElementById('scene-img');
  const wrap=document.getElementById('scene-wrap');
  const W=img.offsetWidth, H=img.offsetHeight;
  document.querySelectorAll('.node').forEach(el=>el.remove());
  NODES.forEach(nd=>{
    const s=state[nd.id];
    const el=document.createElement('div');
    el.className='node '+(s.placed?(s.correct?'correct':'incorrect'):'empty');
    el.id=nd.id;
    el.style.left=(nd.x/100*W)+'px';
    el.style.top=(nd.y/100*H)+'px';
    if(s.placed){
      const lbl=document.createElement('span');
      lbl.className='node-label';
      lbl.textContent=s.placed;
      el.appendChild(lbl);
    }
    el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('drag-over')});
    el.addEventListener('dragleave',()=>el.classList.remove('drag-over'));
    el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('drag-over');handleDrop(nd.id,dragTerm)});
    wrap.appendChild(el);
  });
}

function handleDrop(nodeId, term){
  if(!term) return;
  const nd=NODES.find(n=>n.id===nodeId);
  const s=state[nodeId];
  const wasCor=s.correct;
  if(s.placed){
    if(wasCor) correct--;
    placed--;
    const old=document.querySelector('.chip[data-term="'+s.placed+'"]');
    if(old) old.classList.remove('used');
  }
  const isCor=term===nd.ans;
  s.placed=term; s.correct=isCor;
  if(!state[nodeId].wasPlaced) placed++;
  else placed++;
  if(isCor) correct++;
  state[nodeId].wasPlaced=true;
  const chip=document.querySelector('.chip[data-term="'+term+'"]');
  if(chip) chip.classList.add('used');
  showFeedback(isCor, nd.fb[isCor?'c':'w'], term, nd.ans);
  renderNodes();
  updateScore();
}

function buildBank(){
  const g=document.getElementById('bank');
  g.innerHTML='';
  TERMS.forEach(t=>{
    const c=document.createElement('div');
    c.className='chip'; c.textContent=t; c.draggable=true; c.dataset.term=t;
    c.addEventListener('dragstart',()=>{dragTerm=t;setTimeout(()=>c.classList.add('dragging'),0)});
    c.addEventListener('dragend',()=>{c.classList.remove('dragging');dragTerm=null});
    g.appendChild(c);
  });
}

function reset(){
  NODES.forEach(n=>{state[n.id]={placed:null,correct:false,wasPlaced:false}});
  placed=0;correct=0;
  document.getElementById('fb').className='feedback-bar';
  document.getElementById('fb').textContent='Drop a label onto a white node to begin.';
  document.getElementById('banner').style.display='none';
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('used'));
  renderNodes();updateScore();
}

document.getElementById('resetBtn').addEventListener('click',reset);
window.addEventListener('resize',renderNodes);

const img=document.getElementById('scene-img');
img.src=IMG_B64;
if(img.complete){buildBank();renderNodes();}
else{img.addEventListener('load',()=>{buildBank();renderNodes();});}
</script>
